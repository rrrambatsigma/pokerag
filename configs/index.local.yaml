# Index lokal (fallback) — dipakai saat kuota Gemini tidak tersedia.
#
# Model berbeda dari index GPU, jadi index_version, nama file cache dan nama
# koleksinya terpisah; keduanya tidak bisa tertukar. bge-small butuh instruksi
# khusus untuk query.

snapshot: pokerag-corpus-v1
strategies: [heading]
artifacts_root: artifacts
# bge-small hanya sanggup 512 token, sedangkan chunk `heading` terpanjang 627
# token (tokenizer bge-m3). Fallback ini menerima pemotongan itu secara eksplisit
# supaya tetap bisa dipakai; jumlah chunk terpotong tercatat di identitas embedder.
allow_truncation: true

embedder:
  provider: local
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  max_seq_length: 512
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  items_per_minute: 0
  max_retries: 1
  timeout_seconds: 120

qdrant:
  mode: local
  path: indexes/qdrant
  distance: cosine
  on_disk: true

bm25:
  k1: 1.2
  b: 0.75

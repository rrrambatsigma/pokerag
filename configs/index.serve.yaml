# Serving variant: bge-m3 query encoder on CPU, index untouched.
#
# The vector index was built with bge-m3 fp16 on CUDA. Query encoding on CPU
# uses float32 for compatibility; `dtype: float16` is kept so identity_hash and
# verify_manifest still match the stored index.
snapshot: pokerag-corpus-v2
strategies: [fixed, heading, hierarchical]
artifacts_root: artifacts

embedder:
  provider: st
  model: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  dimension: 1024
  device: cpu
  dtype: float16
  max_seq_length: 1024
  batch_size: 8
  query_prefix: ""
  items_per_minute: 0
  max_retries: 1
  timeout_seconds: 120

qdrant:
  mode: local
  path: indexes/qdrant
  distance: cosine
  on_disk: true

bm25:
  k1: 1.2
  b: 0.75

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokerag"
version = "0.1.0"
description = "Retrieval-grounded Pokemon question answering for the NLP Frontier LLM project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bm25s>=0.3.16",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "qdrant-client>=1.12",
  "rich>=13.9",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pokerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
